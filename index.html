function statCards(){return `<div class="grid grid4 stats">${stats().map(s=>`<div class="panel stat-card"><div class="stat-head"><span>${s.name}</span><span class="stat-icon ${s.c}">${icon(s.i,21)}</span></div><div class="stat-val">${s.val}</div><div class="stat-meta">${s.extra}</div></div>`).join('')}</div>`}
function salesChart(days=7){const arr=Array.from({length:days},(_,i)=>{const date=dateOffset(days-1-i);const total=sumSales(state.orders.filter(o=>o.date===date));return {date,total}}),max=Math.max(...arr.map(x=>x.total),1);return `<div class="chart-wrap"><div class="chart" role="img" aria-label="Biểu đồ doanh thu theo ngày">${arr.map(a=>`<div class="chart-col" title="${dateVN(a.date)}: ${money(a.total)}"><div class="chart-stick" style="height:${Math.max(a.total/max*92,a.total?8:1)}%"><span class="chart-label">${a.date.slice(8)}/${a.date.slice(5,7)}</span></div></div>`).join('')}</div></div>`}
function channelChart(){let totals=channels.map(c=>({name:c,value:state.orders.filter(o=>o.channel===c&&o.status!=='Đã hủy').length,color:channelColor[c]})),all=totals.reduce((s,x)=>s+x.value,0)||1,pos=0;let conic=totals.map(x=>{const a=pos,b=pos+x.value/all*100;pos=b;return `${x.color} ${a}% ${b}%`}).join(',');return `<div class="flex wrap" style="gap:20px;justify-content:space-evenly;padding-top:9px"><div class="donut" style="background:conic-gradient(${conic})"><div class="donut-center"><strong>${totals.reduce((sum,x)=>sum+x.value,0)}</strong><span>Đơn không hủy</span></div></div><div class="channel-legend">${totals.map(x=>`<div class="channel-line"><span><i style="background:${x.color}"></i>${x.name}</span><b>${number(x.value)}</b></div>`).join('')}</div></div>`}
function ordersTable(os,compact=false){if(!os.length)return `<div class="empty">${icon('cart',30)}<strong>Chưa có đơn phù hợp</strong><p>Hãy thử bộ lọc khác hoặc tạo đơn hàng mới.</p></div>`;return `<div class="table-wrap"><table><thead><tr><th>MÃ ĐƠN</th><th>KHÁCH HÀNG</th><th>SẢN PHẨM</th><th>NGÀY TẠO</th><th>TỔNG TIỀN</th><th>TRẠNG THÁI</th>${compact?'':'<th>THAO TÁC</th>'}</tr></thead><tbody>${os.map(o=>`<tr><td><strong>${escapeHTML(o.id)}</strong></td><td>${escapeHTML(customer(o.customerId).name)}</td><td>${escapeHTML(product(o.productId).name)} × ${o.qty}</td><td>${dateVN(o.date)}</td><td><strong>${money(o.qty*o.price)}</strong></td><td>${compact?pill(o.status):`<select class="filter" style="min-height:31px;padding:0 6px;font-size:11px" aria-label="Trạng thái đơn ${escapeHTML(o.id)}" data-order-status="${escapeHTML(o.id)}">${['Mới','Đã xác nhận','Đang giao','Hoàn thành','Đã hủy'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>`}</td>${compact?'':`<td><button class="btn btn-outline btn-sm" data-action="order-detail" data-id="${escapeHTML(o.id)}">Chi tiết</button></td>`}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){return `${header('Chào mừng quay lại! 👋',`<select class="filter" aria-label="Khoảng thời gian báo cáo" data-window><option value="7" ${windowDays===7?'selected':''}>7 ngày gần đây</option><option value="30" ${windowDays===30?'selected':''}>30 ngày gần đây</option><option value="365" ${windowDays===365?'selected':''}>12 tháng gần đây</option></select><button class="btn btn-primary" data-action="add-order">${icon('plus')} Tạo đơn hàng</button>`)}${statCards()}<div class="grid grid3 mb"><section class="panel pad span2"><div class="panel-head"><div><div class="panel-title">Tổng quan doanh thu</div><div class="panel-desc">Số liệu từ các đơn đã hoàn thành · 7 ngày</div></div><span class="pill blue">${icon('chart',12)} Doanh thu</span></div>${salesChart(7)}</section><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Đơn hàng theo kênh</div><div class="panel-desc">Cơ cấu đơn từ từng kênh mẫu</div></div></div>${channelChart()}</section></div><div class="grid grid3"><section class="panel pad span2"><div class="panel-head"><div><div class="panel-title">Đơn hàng gần đây</div><div class="panel-desc">Theo dõi hoạt động mới nhất</div></div><button class="btn-link" data-page="orders">Xem tất cả ${icon('arrow',13)}</button></div>${ordersTable([...state.orders].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,5),true)}</section><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Việc cần chú ý</div><div class="panel-desc">Cập nhật theo dữ liệu mẫu</div></div></div>${[{n:state.products.filter(p=>p.stock<10).length,t:'Sản phẩm sắp hết hàng',i:'box',go:'products'},{n:state.conversations.filter(c=>!c.resolved).length,t:'Hội thoại cần phản hồi',i:'inbox',go:'inbox'},{n:state.orders.filter(o=>o.status==='Mới').length,t:'Đơn chờ xác nhận',i:'cart',go:'orders'}].map(x=>`<button class="list-line" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer" data-page="${x.go}"><span class="flex"><span class="round-icon">${icon(x.i)}</span><span style="font-size:12px;color:#496384">${x.t}</span></span><span class="pill ${x.n?'orange':'green'}">${x.n}</span></button>`).join('')}<div class="notice mt">${icon('info')}<span>Đây là bảng điều khiển minh họa. Các số liệu cập nhật theo thao tác trên dữ liệu mẫu.</span></div></section></div>`}
function inbox(){let list=state.conversations.filter(c=>{const name=customer(c.customerId).name.toLowerCase();return (name.includes(query.toLowerCase())||c.messages.some(m=>m.text.toLowerCase().includes(query.toLowerCase())))&&(statusFilter==='Tất cả'||(statusFilter==='Chưa xử lý'&&!c.resolved)||(statusFilter==='Đã xử lý'&&c.resolved)||(statusFilter===c.channel))});let active=state.conversations.find(c=>c.id===selectedConv)||state.conversations[0];return `${header(null,`<button class="btn btn-outline" data-action="reset-filters">${icon('refresh')} Bỏ lọc</button>`)}<div class="toolbar"><label class="search-field">${icon('search')}<input id="list-search" placeholder="Tìm khách hàng hoặc hội thoại..." value="${escapeHTML(query)}" aria-label="Tìm hội thoại"></label><select class="filter" id="list-filter" aria-label="Lọc hội thoại">${['Tất cả','Chưa xử lý','Đã xử lý',...channels].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><section class="panel inbox-shell"><div class="conv-list"><div class="conv-head between"><b style="font-size:13px;color:#294968">Hội thoại <span class="pill blue">${list.length}</span></b><span class="pill green">${state.conversations.filter(c=>!c.resolved).length} chưa xử lý</span></div><div class="conv-scroll">${list.length?list.map(c=>{const cust=customer(c.customerId);return `<div class="conv-item ${active&&active.id===c.id?'active':''}" data-action="select-conv" data-id="${c.id}" tabindex="0" role="button" aria-label="Mở hội thoại của ${escapeHTML(cust.name)}"><span class="conv-avatar">${escapeHTML(cust.name.split(' ').slice(-1)[0][0])}</span><div class="conv-info"><div class="between"><div class="conv-name truncate">${escapeHTML(cust.name)} ${c.unread?'<span style="color:#2b70ef">●</span>':''}</div><span class="conv-time">${escapeHTML(c.messages.at(-1)?.time||'')}</span></div><div class="conv-preview truncate">${escapeHTML(c.messages.at(-1)?.text||'')}</div><div style="margin-top:6px"><span class="chat-tag">${escapeHTML(c.channel)}</span> ${c.resolved?'<span class="chat-tag">Đã xử lý</span>':''}</div></div></div>`}).join(''):`<div class="empty">Không tìm thấy hội thoại</div>`}</div></div>${active?`<div class="chat-center"><div class="chat-top"><div class="flex" style="min-width:0"><div class="conv-avatar">${escapeHTML(customer(active.customerId).name.slice(-1))}</div><div style="min-width:0"><b class="truncate" style="display:block;font-size:13px;color:#294966">${escapeHTML(customer(active.customerId).name)}</b><span class="tiny muted">${escapeHTML(active.channel)} · ${active.resolved?'Đã xử lý':'Đang hỗ trợ'}</span></div></div><button class="btn btn-outline btn-sm" data-action="resolve-conv" data-id="${active.id}">${icon('check',14)} ${active.resolved?'Mở lại':'Hoàn tất'}</button></div><div class="chat-messages" id="chat-history">${active.messages.map(m=>`<div class="bubble-wrap ${m.from==='me'?'mine':''}"><div class="bubble">${escapeHTML(m.text)}<small>${escapeHTML(m.time||'')}</small></div></div>`).join('')}</div><div class="chat-compose"><form id="chat-form"><label for="chat-text" class="tiny muted">Soạn phản hồi · Demo cục bộ</label><textarea id="chat-text" name="message" placeholder="Nhập nội dung tin nhắn..." required></textarea><div class="between wrap"><div class="flex wrap"><button type="button" class="btn btn-ghost btn-sm" data-action="ai-draft">${icon('spark',14)} Gợi ý trả lời</button><button type="button" class="btn btn-outline btn-sm" data-action="order-conv">${icon('cart',14)} Tạo đơn</button></div><button type="submit" class="btn btn-primary btn-sm">${icon('send',14)} Gửi thử</button></div></form></div></div><div class="customer-side"><div class="between"><h3>Thông tin khách hàng</h3><span class="pill blue">CRM</span></div><div style="text-align:center;margin:22px 0"><div class="conv-avatar" style="height:61px;width:61px;font-size:22px;margin:auto">${escapeHTML(customer(active.customerId).name.slice(-1))}</div><b style="display:block;margin-top:8px;color:#304a68;font-size:13px">${escapeHTML(customer(active.customerId).name)}</b><span class="tiny muted">${escapeHTML(active.channel)}</span></div><div class="separator"></div><div class="side-item"><span>Số điện thoại demo</span><strong>${escapeHTML(customer(active.customerId).phone)}</strong></div><div class="side-item"><span>Email</span><strong>${escapeHTML(customer(active.customerId).email)}</strong></div><div class="side-item"><span>Nhãn hội thoại</span><strong>${escapeHTML(active.tag)}</strong></div><div class="side-item"><span>Số đơn đã tạo</span><strong>${state.orders.filter(o=>o.customerId===active.customerId).length} đơn</strong></div><button class="btn btn-outline btn-block btn-sm" data-action="tag-conv">${icon('edit',14)} Đổi nhãn</button><div class="smart-box">${icon('spark',16)} <strong>Trợ lý thông minh</strong><p style="margin-top:6px">Có thể gợi ý câu trả lời dựa trên kho FAQ mẫu. Chưa kết nối API AI thực.</p></div></div>`:`<div class="empty">Chưa có hội thoại</div>`}</section><div class="notice mt">${icon('info')}<div><strong>Lưu ý demo:</strong> Nội dung gửi ở đây chỉ hiển thị và lưu trong trình duyệt. Không gửi sang Facebook, Instagram, Zalo hoặc TikTok.</div></div>`}
function products(){let ps=state.products.filter(p=>(p.name.toLowerCase().includes(query.toLowerCase())||p.sku.toLowerCase().includes(query.toLowerCase()))&&(statusFilter==='Tất cả'||(statusFilter==='Sắp hết'&&p.stock<10)||(statusFilter===p.category)));return `${header(null,`<button class="btn btn-primary" data-action="add-product">${icon('plus')} Thêm sản phẩm</button>`)}<div class="grid grid3 mb"><div class="panel pad"><span class="small muted">Tổng sản phẩm</span><h2 style="margin-top:8px">${state.products.length}</h2></div><div class="panel pad"><span class="small muted">Số lượng tồn</span><h2 style="margin-top:8px">${number(state.products.reduce((s,p)=>s+p.stock,0))}</h2></div><div class="panel pad"><span class="small muted">Sản phẩm sắp hết (&lt; 10)</span><h2 style="margin-top:8px;color:#c58a25">${state.products.filter(p=>p.stock<10).length}</h2></div></div><section class="panel pad"><div class="toolbar"><label class="search-field">${icon('search')}<input id="list-search" value="${escapeHTML(query)}" placeholder="Tìm tên hoặc SKU..." aria-label="Tìm sản phẩm"></label><select id="list-filter" class="filter" aria-label="Lọc sản phẩm">${['Tất cả','Sắp hết',...new Set(state.products.map(p=>p.category))].map(s=>`<option ${s===statusFilter?'selected':''}>${escapeHTML(s)}</option>`).join('')}</select><button class="btn btn-outline" data-action="export-products">${icon('download')} Xuất CSV</button></div>${ps.length?`<div class="table-wrap"><table><thead><tr><th>SẢN PHẨM</th><th>MÃ SKU</th><th>PHÂN LOẠI</th><th>GIÁ BÁN</th><th>TỒN KHO</th><th>THAO TÁC</th></tr></thead><tbody>${ps.map(p=>`<tr><td><div class="flex"><div class="thumb" aria-hidden="true">${escapeHTML(p.emoji||'📦')}</div><strong>${escapeHTML(p.name)}</strong></div></td><td><span class="code">${escapeHTML(p.sku)}</span></td><td>${escapeHTML(p.category)}</td><td><strong>${money(p.price)}</strong></td><td>${p.stock<10?`<span class="pill orange">${p.stock} · Sắp hết</span>`:`<span class="pill green">${p.stock} · Sẵn có</span>`}</td><td><div class="action-group"><button class="btn btn-outline btn-sm" data-action="edit-product" data-id="${p.id}">${icon('edit',14)} Sửa</button><button class="more" aria-label="Xóa ${escapeHTML(p.name)}" data-action="delete-product" data-id="${p.id}">${icon('trash',16)}</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('box',32)}<strong>Không có sản phẩm phù hợp</strong><p>Thay đổi từ khóa hoặc bộ lọc để xem thêm.</p></div>`}</section>`}
function orders(){let os=state.orders.filter(o=>(o.id.toLowerCase().includes(query.toLowerCase())||customer(o.customerId).name.toLowerCase().includes(query.toLowerCase()))&&(statusFilter==='Tất cả'||o.status===statusFilter)).sort((a,b)=>b.id.localeCompare(a.id));return `${header(null,`<button class="btn btn-primary" data-action="add-order">${icon('plus')} Tạo đơn mới</button>`)}<div class="grid grid3 mb"><div class="panel pad"><span class="small muted">Tất cả đơn hàng</span><h2 style="margin-top:8px">${state.orders.length}</h2></div><div class="panel pad"><span class="small muted">Đơn hoàn thành</span><h2 style="margin-top:8px">${state.orders.filter(o=>o.status==='Hoàn thành').length}</h2></div><div class="panel pad"><span class="small muted">Doanh thu đã hoàn thành</span><h2 style="margin-top:8px">${money(sumSales(state.orders))}</h2></div></div><section class="panel pad"><div class="toolbar"><label class="search-field">${icon('search')}<input id="list-search" value="${escapeHTML(query)}" placeholder="Tìm mã đơn, tên khách hàng..." aria-label="Tìm đơn hàng"></label><select class="filter" id="list-filter" aria-label="Lọc trạng thái">${['Tất cả','Mới','Đã xác nhận','Đang giao','Hoàn thành','Đã hủy'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-outline" data-action="export-orders">${icon('download')} Xuất CSV</button></div>${ordersTable(os)}</section><div class="notice mt">${icon('info')}<span>Đơn mới được trừ tồn kho trong dữ liệu dùng thử. Chuyển trạng thái đã hủy sẽ hoàn tồn kho cho đơn được tạo mới trong phiên demo.</span></div>`}
function customers(){const cs=state.customers.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(query.toLowerCase())&&(statusFilter==='Tất cả'||c.channel===statusFilter));return `${header(null,`<button class="btn btn-primary" data-action="add-customer">${icon('plus')} Thêm khách hàng</button>`)}<div class="toolbar"><label class="search-field">${icon('search')}<input id="list-search" value="${escapeHTML(query)}" placeholder="Tìm tên, số điện thoại hoặc email..." aria-label="Tìm khách hàng"></label><select class="filter" id="list-filter" aria-label="Lọc theo kênh">${['Tất cả',...channels].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-outline" data-action="export-customers">${icon('download')} Xuất CSV</button></div><section class="panel pad">${cs.length?`<div class="table-wrap"><table><thead><tr><th>KHÁCH HÀNG</th><th>SỐ ĐIỆN THOẠI</th><th>EMAIL</th><th>NGUỒN</th><th>ĐƠN HÀNG</th><th>THAO TÁC</th></tr></thead><tbody>${cs.map(c=>`<tr><td><div class="flex"><span class="conv-avatar">${escapeHTML(c.name.slice(-1))}</span><strong>${escapeHTML(c.name)}</strong></div></td><td>${escapeHTML(c.phone)}</td><td>${escapeHTML(c.email)}</td><td><span class="pill blue">${escapeHTML(c.channel)}</span></td><td>${state.orders.filter(o=>o.customerId===c.id).length}</td><td><button class="btn btn-outline btn-sm" data-action="edit-customer" data-id="${c.id}">${icon('edit',13)} Chỉnh sửa</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Không có khách hàng phù hợp.</div>`}</section>`}
function ai(){return `${header(null,`<span class="pill orange">${icon('info',13)} Gợi ý quy tắc – chưa dùng AI thật</span>`)}<div class="notice mb">${icon('info')}<div><strong>Phân biệt khả năng:</strong> Nút “Gợi ý” trong hộp thư áp dụng quy tắc FAQ lưu tại trình duyệt. Để tạo phản hồi AI thực, cần backend bảo mật, API model, xác nhận quyền và giám sát nội dung.</div></div><div class="grid grid2"><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Cấu hình trợ lý</div><div class="panel-desc">Điều chỉnh phong cách hỗ trợ trong bản demo</div></div><span class="stat-icon">${icon('bot')}</span></div><div class="between mb"><div><h3>Gợi ý câu trả lời</h3><span class="small muted">Cho phép đề xuất nội dung phản hồi mẫu</span></div><input type="checkbox" class="toggle" id="ai-toggle" ${state.config.aiOn?'checked':''} aria-label="Bật gợi ý"></div><div class="field"><label for="ai-tone">Giọng điệu thương hiệu</label><select id="ai-tone">${['Thân thiện','Chuyên nghiệp','Nhiệt tình','Ngắn gọn'].map(s=>`<option ${state.config.tone===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="save-ai">${icon('check')} Lưu cấu hình</button><div class="separator"></div><h3>Nguyên tắc trả lời</h3><p class="small muted" style="margin-top:9px">Ưu tiên thông tin trong kho FAQ; tránh khẳng định giá, tồn kho và chính sách khi chưa xác minh. Nhân viên có thể sửa mọi gợi ý trước khi gửi.</p></section><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Kho kiến thức bán hàng</div><div class="panel-desc">Bộ câu hỏi và trả lời mẫu</div></div><button class="btn btn-primary btn-sm" data-action="add-faq">${icon('plus',15)} Thêm FAQ</button></div>${state.faq.map(f=>`<div class="list-line" style="align-items:flex-start"><div style="min-width:0"><b style="font-size:12px;color:#334d6d">${escapeHTML(f.q)}</b><p class="small muted" style="margin-top:4px">${escapeHTML(f.a)}</p></div><button class="more" data-action="delete-faq" data-id="${f.id}" aria-label="Xóa FAQ">${icon('trash',15)}</button></div>`).join('')||'<div class="empty">Chưa có FAQ.</div>'}</section></div><section class="panel pad mt"><div class="panel-head"><div><div class="panel-title">Quy trình AI được đề xuất cho production</div><div class="panel-desc">Mẫu chuẩn hóa kiểm soát chất lượng và an toàn</div></div><div class="grid grid4">${[['01','Nhận tin nhắn','API hợp lệ & webhook'],['02','Hiểu yêu cầu','Ngữ cảnh, FAQ, tồn kho'],['03','Đề xuất phản hồi','Có kiểm tra nội dung'],['04','Nhân viên duyệt','Gửi qua kết nối đã cấp quyền']].map(x=>`<div class="two-tone" style="border-radius:12px;padding:16px"><span class="step-dot">${x[0]}</span><h3 style="margin:12px 0 5px">${x[1]}</h3><p class="small muted">${x[2]}</p></div>`).join('')}</div></section>`}
function live(){let kw=state.config.liveKeyword.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);const interested=state.liveComments.filter(c=>kw.some(k=>c.text.toLowerCase().includes(k)));return `${header(null,`<span class="pill ${state.config.liveActive?'green':'gray'}">${state.config.liveActive?'● Đang chạy mô phỏng':'○ Chưa bắt đầu'}</span>`)}<div class="live-hero mb"><div><h2>Tăng tốc chốt đơn livestream</h2><p>Nhận diện từ khóa mua hàng, theo dõi bình luận và tạo đơn thử trong cùng màn hình.</p></div><button class="btn" style="background:#fff;color:#174cb4" data-action="toggle-live">${icon('live')} ${state.config.liveActive?'Kết thúc phiên thử':'Bắt đầu mô phỏng'}</button></div><div class="grid grid3 mb"><div class="panel pad"><span class="small muted">Bình luận trong bản demo</span><h2 style="margin-top:8px">${state.liveComments.length}</h2></div><div class="panel pad"><span class="small muted">Bình luận có từ khóa</span><h2 style="margin-top:8px">${interested.length}</h2></div><div class="panel pad"><span class="small muted">Trạng thái phiên</span><h2 style="margin-top:8px;font-size:19px">${state.config.liveActive?'Đang mô phỏng':'Tạm dừng'}</h2></div></div><div class="grid grid2"><section class="panel pad"><div class="panel-head"><div class="panel-title">Khung livestream</div><span class="pill red">DEMO</span></div><div class="live-card"><span class="live-badge">${state.config.liveActive?'● LIVE THỬ':'CHƯA PHÁT'}</span><span class="pulse">${icon('live',32)}</span><h2 style="color:#fff">Mô phỏng phiên bán hàng</h2><p class="small" style="color:#a9bfdb;max-width:260px">Không truy cập video hay bình luận từ nền tảng bên ngoài.</p></div><div class="separator"></div><div class="field"><label for="live-keyword">Từ khóa nhận diện (cách nhau bằng dấu phẩy)</label><input id="live-keyword" value="${escapeHTML(state.config.liveKeyword)}" placeholder="chốt,mua,đặt"></div><button class="btn btn-outline" data-action="save-live-keyword">${icon('check')} Lưu từ khóa</button></section><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Bình luận phiên thử</div><div class="panel-desc">${interested.length} bình luận có dấu hiệu đặt hàng</div></div><button class="btn btn-outline btn-sm" data-action="add-comment">${icon('plus',14)} Bình luận thử</button></div><div style="max-height:355px;overflow:auto">${[...state.liveComments].reverse().map(c=>{const match=kw.some(k=>c.text.toLowerCase().includes(k));return `<div class="live-comment"><div class="between"><b>${escapeHTML(c.name)}</b><span>${escapeHTML(c.time)}</span></div><p style="margin-top:5px;color:#506784">${escapeHTML(c.text)}</p>${match?'<div style="margin-top:7px"><span class="tag">Có từ khóa quan tâm</span></div>':''}</div>`}).join('')}</div><div class="notice mt">${icon('info')}<span>Phần mềm chỉ tự động xử lý bình luận thật khi có API, webhook và quyền truy cập được nền tảng chấp thuận.</span></div></section></div>`}
function marketing(){const cs=state.campaigns.filter(c=>c.name.toLowerCase().includes(query.toLowerCase())&&(statusFilter==='Tất cả'||statusFilter===c.status));return `${header(null,`<button class="btn btn-primary" data-action="add-campaign">${icon('plus')} Tạo chiến dịch</button>`)}<div class="grid grid3 mb"><div class="panel pad"><span class="small muted">Tổng chiến dịch</span><h2 style="margin-top:8px">${state.campaigns.length}</h2></div><div class="panel pad"><span class="small muted">Kịch bản đang bật</span><h2 style="margin-top:8px">${state.campaigns.filter(c=>c.status==='Đang chạy').length}</h2></div><div class="panel pad"><span class="small muted">Bản nháp</span><h2 style="margin-top:8px">${state.campaigns.filter(c=>c.status==='Bản nháp').length}</h2></div></div><section class="panel pad"><div class="toolbar"><label class="search-field">${icon('search')}<input id="list-search" value="${escapeHTML(query)}" placeholder="Tìm tên chiến dịch..." aria-label="Tìm chiến dịch"></label><select id="list-filter" class="filter" aria-label="Lọc trạng thái">${['Tất cả','Đang chạy','Bản nháp','Tạm dừng'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>CHIẾN DỊCH</th><th>LOẠI</th><th>KÊNH</th><th>NGÀY TẠO</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody>${cs.map(c=>`<tr><td><strong>${escapeHTML(c.name)}</strong></td><td>${escapeHTML(c.type)}</td><td>${escapeHTML(c.channel)}</td><td>${dateVN(c.date)}</td><td>${pill(c.status)}</td><td><button class="btn btn-outline btn-sm" data-action="toggle-campaign" data-id="${c.id}">${c.status==='Đang chạy'?'Tạm dừng':'Bật thử'}</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice mt">${icon('info')}<span>Trạng thái chiến dịch chỉ là dữ liệu mô phỏng, không tự gửi tin nhắn quảng cáo. Khi triển khai thật phải đáp ứng quyền API, quy tắc nền tảng và sự đồng ý của khách.</span></div>`}
function reports(){let os=ordersByDays(windowDays),done=os.filter(o=>o.status==='Hoàn thành'),byProduct=state.products.map(p=>({p,qty:os.filter(o=>o.productId===p.id&&o.status==='Hoàn thành').reduce((s,o)=>s+o.qty,0)})).sort((a,b)=>b.qty-a.qty);return `${header(null,`<select class="filter" data-window aria-label="Khoảng thời gian báo cáo"><option value="7" ${windowDays===7?'selected':''}>7 ngày</option><option value="30" ${windowDays===30?'selected':''}>30 ngày</option><option value="365" ${windowDays===365?'selected':''}>12 tháng</option></select><button class="btn btn-outline" data-action="export-orders">${icon('download')} Xuất báo cáo</button>`)}<div class="grid grid3 mb"><div class="panel pad"><span class="small muted">Doanh thu đã hoàn thành</span><h2 style="margin-top:8px">${money(sumSales(os))}</h2></div><div class="panel pad"><span class="small muted">Giá trị đơn hoàn thành trung bình</span><h2 style="margin-top:8px">${money(done.length?sumSales(done)/done.length:0)}</h2></div><div class="panel pad"><span class="small muted">Tỷ lệ hoàn thành theo đơn</span><h2 style="margin-top:8px">${os.length?(done.length/os.length*100).toFixed(1):'0'}%</h2></div></div><div class="grid grid2"><section class="panel pad"><div class="panel-head"><div><div class="panel-title">Doanh thu theo ngày</div><p class="panel-desc">Biểu đồ 7 ngày gần đây</p></div></div>${salesChart()}</section><section class="panel pad"><div class="panel-head"><div class="panel-title">Sản phẩm bán chạy</div></div>${byProduct.length?byProduct.slice(0,6).map((x,i)=>`<div class="list-line"><div class="flex"><span class="thumb" style="width:37px;height:37px">${escapeHTML(x.p.emoji)}</span><div><b style="font-size:12px;color:#344e70">${escapeHTML(x.p.name)}</b><div class="tiny muted">${escapeHTML(x.p.sku)}</div></div></div><strong style="font-size:12px">${x.qty} đã bán</strong></div>`).join(''):'<div class="empty">Không có sản phẩm.</div>'}</section></div><section class="panel pad mt"><div class="panel-head"><div><div class="panel-title">Phân bổ đơn hàng theo kênh</div><div class="panel-desc">Đơn đã ghi nhận, không bao gồm đơn hủy</div></div></div><div class="grid grid3">${channels.map(c=>{let n=os.filter(o=>o.channel===c&&o.status!=='Đã hủy').length;return `<div style="padding:12px 10px"><div class="between small"><b style="color:#415f84">${c}</b><strong>${n} đơn</strong></div><div class="progress mt" style="margin-top:9px"><span style="width:${os.length?n/os.length*100:0}%;background:${channelColor[c]}"></span></div></div>`}).join('')}</div></section>`}
function team(){return `${header(null,`<button class="btn btn-primary" data-action="add-team">${icon('plus')} Thêm thành viên demo</button>`)}<div class="notice mb">${icon('shield')}<span>Phân quyền trong bản demo chỉ là danh sách hiển thị. Khi có backend, quyền đọc/ghi phải được xác minh trên máy chủ cho mọi API.</span></div><div class="grid grid3">${state.team.map(t=>`<div class="panel pad"><div class="between"><div class="avatar">${escapeHTML(t.name.slice(-2).toUpperCase())}</div><span class="pill ${t.role==='Chủ cửa hàng'?'blue':'gray'}">${escapeHTML(t.role)}</span></div><h3 style="margin:16px 0 5px">${escapeHTML(t.name)}</h3><p class="small muted">Thành viên quản lý dữ liệu cửa hàng</p>${t.role!=='Chủ cửa hàng'?`<button style="margin-top:15px" class="btn btn-outline btn-sm" data-action="delete-team" data-id="${t.id}">${icon('trash',14)} Xóa bản demo</button>`:''}</div>`).join('')}</div><section class="panel pad mt"><div class="panel-head"><div class="panel-title">Vai trò đề xuất</div></div><div class="grid grid3">${[['Chủ cửa hàng','Toàn quyền cấu hình, phân quyền và báo cáo.'],['Quản lý','Quản trị đơn hàng, nhân sự được giao và chiến dịch.'],['Nhân viên','Đọc, phản hồi hội thoại và xử lý đơn được phân công.']].map(x=>`<div class="two-tone" style="padding:16px;border-radius:12px"><h3>${x[0]}</h3><p class="small muted" style="margin-top:6px">${x[1]}</p></div>`).join('')}</div></section>`}
function settings(){return `${header()}<div class="grid grid2"><section class="panel pad"><div class="panel-head"><div class="panel-title">Thông tin cửa hàng</div><span class="stat-icon">${icon('settings')}</span></div><div class="field"><label for="shop-name">Tên cửa hàng</label><input id="shop-name" value="${escapeHTML(state.config.shop)}" maxlength="75"></div><div class="between mb"><div><h3>Thông báo trong ứng dụng</h3><p class="small muted">Bật/tắt mô phỏng cài đặt thông báo</p></div><input class="toggle" type="checkbox" id="notif-toggle" ${state.config.notify?'checked':''} aria-label="Bật thông báo"></div><button class="btn btn-primary" data-action="save-settings">${icon('check')} Lưu cài đặt</button><div class="separator"></div><div class="panel-title" style="font-size:14px;margin-bottom:8px">Dữ liệu bản demo</div><p class="small muted" style="margin-bottom:14px">Dữ liệu chỉ lưu trong localStorage của trình duyệt. Hãy xuất bản sao trước khi xóa.</p><div class="flex wrap"><button class="btn btn-outline btn-sm" data-action="backup-data">${icon('download',14)} Sao lưu JSON</button><button class="btn btn-danger btn-sm" data-action="reset-data">${icon('refresh',14)} Khôi phục dữ liệu mẫu</button></div></section><section class="panel pad"><div class="panel-head"><div class="panel-title">Kết nối các nền tảng</div><span class="pill orange">Cần cấu hình máy chủ</span></div>${[['Facebook Messenger','Hội thoại và bình luận'],['Instagram','Tin nhắn khách hàng'],['Zalo OA','Hội thoại và chăm sóc khách'],['TikTok','Tích hợp theo API được cấp quyền'],['Thanh toán & vận chuyển','Đối tác API độc lập']].map(x=>`<div class="list-line"><div><b style="font-size:13px;color:#334e70">${x[0]}</b><div class="tiny muted">${x[1]}</div></div><button class="btn btn-outline btn-sm" data-action="connect-info" data-name="${escapeHTML(x[0])}">${icon('external',13)} Cấu hình</button></div>`).join('')}</section></div><div class="notice mt">${icon('shield')}<span>Không nhập Access Token, API Secret hay mật khẩu vào bản HTML tĩnh hoặc repository công khai. Các khóa nhạy cảm phải đặt trong backend có xác thực, kiểm tra quyền và mã hóa phù hợp.</span></div>`}
function intro(){const features=[['inbox','Hộp thư hợp nhất','Phân loại và phản hồi hội thoại nhanh từ một màn hình.'],['bot','Gợi ý phản hồi','Kho kiến thức và quy tắc cho phép xử lý tình huống thường gặp.'],['cart','Quản lý đơn hàng','Xem lịch sử, trạng thái đơn và kiểm soát dữ liệu kinh doanh.'],['live','Livestream trực quan','Theo dõi bình luận thử và nhận diện tín hiệu mua hàng.'],['chart','Báo cáo rõ ràng','Số liệu được tính từ dữ liệu thực có trong bản demo.'],['shield','Thiết kế chú trọng an toàn','Tách giao diện công khai và kết nối API đòi hỏi bảo mật.']];return `<section class="hero"><div><span class="pill" style="background:#ffffff24;color:#fff;border:1px solid #ffffff44">${icon('spark',14)} Nền tảng quản lý bán hàng</span><h1>OmniflowAI – quản lý tập trung, bán hàng thông minh.</h1><p>Mọi hội thoại, đơn hàng, sản phẩm và báo cáo được tổ chức trong một trải nghiệm mạch lạc, hiện đại và tối ưu cho tiếng Việt.</p><button class="btn" data-page="dashboard">Vào bảng điều khiển ${icon('arrow')}</button></div><div class="hero-graphic" aria-hidden="true"><div class="hero-screenshot"><div class="flex"><span class="round-icon">${icon('chart')}</span><div style="flex:1"><div class="hero-row"></div><div class="hero-row"></div></div></div><div class="hero-row"></div><div class="hero-row"></div><div class="hero-row"></div></div></div></section><div style="text-align:center;margin:44px auto 24px"><div class="eyebrow">MỘT NỀN TẢNG – NHIỀU TÁC VỤ</div><h2>Công cụ được thiết kế quanh công việc thực tế</h2><p class="muted" style="margin-top:8px;font-size:13px">Một phiên bản trải nghiệm bằng HTML, sẵn sàng mở rộng với backend riêng.</p></div><div class="grid grid3">${features.map(x=>`<div class="panel feature-card"><span class="stat-icon">${icon(x[0],21)}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div style="text-align:center;margin:45px auto 25px"><div class="eyebrow">BẮT ĐẦU NHANH</div><h2>Ba bước khám phá OmniflowAI</h2></div><div class="grid grid3 mb">${[['01','Xem tổng quan','Theo dõi các chỉ số từ dữ liệu thử.'],['02','Thử thao tác','Tạo đơn, phản hồi tin nhắn, thêm sản phẩm.'],['03','Chuẩn bị kết nối','Thiết kế backend và API hợp lệ khi triển khai thực tế.']].map(x=>`<div class="panel feature-card"><span class="step-dot">${x[0]}</span><h3 style="margin-top:15px">${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><section class="panel pad"><div class="panel-head"><div class="panel-title">Câu hỏi thường gặp</div></div>${[['Mở tệp HTML có cần cài đặt phần mềm không?','Không. Bạn có thể mở tệp HTML trực tiếp trong trình duyệt để dùng bản demo.'],['Dữ liệu có đồng bộ giữa điện thoại và máy tính không?','Chưa. Bản demo lưu dữ liệu trong trình duyệt đang sử dụng; đồng bộ thật cần tài khoản, database và backend.'],['OmniflowAI đã kết nối Facebook hay TikTok thật chưa?','Chưa. Các màn hình hiện tại là mô phỏng công việc; kết nối thật cần API và quyền truy cập phù hợp.'],['Có thể xuất bản bằng GitHub Pages không?','Có. GitHub Pages có thể xuất bản giao diện tĩnh từ index.html. Các tính năng backend cần dịch vụ bên ngoài.']].map(x=>`<details class="faq-row"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</section><div class="callout-row mt"><div><b>Sẵn sàng trải nghiệm giao diện?</b><p class="small muted">Mở bảng điều khiển và thao tác trực tiếp trên dữ liệu mẫu.</p></div><button class="btn btn-primary" data-page="dashboard">Vào ứng dụng ${icon('arrow')}</button></div>`}
const views={dashboard,inbox,ai,livestream:live,orders,products,customers,marketing,reports,team,settings,intro};
function render(){if(!views[page])page='dashboard';const active=document.activeElement;const focused=active?.id,selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;document.getElementById('app').innerHTML=shell(views[page]());if(focused==='list-search'){let el=document.getElementById('list-search');if(el){el.focus();if(selStart!==null)el.setSelectionRange(selStart,selStart)}}if(page==='inbox'){let hist=document.getElementById('chat-history');if(hist)hist.scrollTop=hist.scrollHeight}}
function go(p){page=p;query='';statusFilter='Tất cả';sidebarOpen=false;if(location.protocol!=='about:')location.hash=p;render();window.scrollTo({top:0,behavior:'instant'})}
let toastTimer;function toast(msg,error=false){let t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3300)}
function modal(title,body,footer=''){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><div class="modal-title"><h2>${escapeHTML(title)}</h2><button type="button" class="modal-x" data-action="close-modal" aria-label="Đóng">×</button></div>${body}${footer}</div></div>`;const el=document.querySelector('.modal input:not([type="hidden"]),.modal select,.modal textarea');if(el)el.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function formFoot(label){return `<div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Hủy</button><button type="submit" class="btn btn-primary">${icon('check',15)} ${label}</button></div>`}
function productModal(id){const p=id?state.products.find(x=>x.id===id):null;modal(p?'Chỉnh sửa sản phẩm':'Thêm sản phẩm',`<form id="product-form"><input type="hidden" name="id" value="${p?.id||''}"><div class="modal-body"><div class="field"><label>Tên sản phẩm *</label><input name="name" required maxlength="100" value="${escapeHTML(p?.name||'')}" placeholder="Ví dụ: Bình giữ nhiệt 500 ml"></div><div class="form-row"><div class="field"><label>Mã SKU *</label><input name="sku" required maxlength="32" value="${escapeHTML(p?.sku||'')}" placeholder="SP-001"></div><div class="field"><label>Danh mục</label><input name="category" maxlength="50" value="${escapeHTML(p?.category||'Khác')}" placeholder="Phụ kiện"></div></div><div class="form-row"><div class="field"><label>Giá bán (VNĐ) *</label><input type="number" name="price" min="0" step="1000" required value="${p?.price??''}"></div><div class="field"><label>Tồn kho *</label><input type="number" name="stock" min="0" step="1" required value="${p?.stock??''}"></div></div><div class="field"><label>Biểu tượng (emoji)</label><input name="emoji" maxlength="4" value="${escapeHTML(p?.emoji||'📦')}"></div></div>${formFoot(p?'Lưu thay đổi':'Tạo sản phẩm')}</form>`)}
function customerModal(id){const c=id?state.customers.find(x=>x.id===id):null;modal(c?'Chỉnh sửa khách hàng':'Thêm khách hàng',`<form id="customer-form"><input name="id" type="hidden" value="${c?.id||''}"><div class="modal-body"><div class="field"><label>Họ và tên *</label><input required name="name" maxlength="85" value="${escapeHTML(c?.name||'')}" placeholder="Nguyễn Văn A"></div><div class="field"><label>Số điện thoại *</label><input required name="phone" maxlength="25" value="${escapeHTML(c?.phone||'')}" placeholder="09xx xxx xxx"></div><div class="field"><label>Email</label><input type="email" name="email" maxlength="90" value="${escapeHTML(c?.email||'')}" placeholder="email@example.com"></div><div class="field"><label>Nguồn khách hàng</label><select name="channel">${channels.map(s=>`<option ${s===c?.channel?'selected':''}>${s}</option>`).join('')}</select></div></div>${formFoot(c?'Lưu khách hàng':'Thêm khách hàng')}</form>`)}
function orderModal(preCustomer){if(!state.products.length||!state.customers.length){toast('Cần có sản phẩm và khách hàng trước khi tạo đơn.',true);return}modal('Tạo đơn hàng mới',`<form id="order-form"><div class="modal-body"><div class="field"><label>Khách hàng *</label><select required name="customerId">${state.customers.map(c=>`<option value="${c.id}" ${preCustomer===c.id?'selected':''}>${escapeHTML(c.name)} – ${escapeHTML(c.phone)}</option>`).join('')}</select></div><div class="field"><label>Sản phẩm *</label><select required name="productId">${state.products.map(p=>`<option value="${p.id}" ${p.stock===0?'disabled':''}>${escapeHTML(p.name)} · ${money(p.price)} · tồn ${p.stock}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label>Số lượng *</label><input type="number" name="qty" min="1" value="1" step="1" required></div><div class="field"><label>Kênh bán</label><select name="channel">${channels.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="notice">${icon('info')}<span>Tổng tiền được tính từ giá sản phẩm. Tạo đơn sẽ trừ tồn kho tại dữ liệu mẫu.</span></div></div>${formFoot('Xác nhận tạo đơn')}</form>`)}
function campaignModal(){modal('Tạo chiến dịch demo',`<form id="campaign-form"><div class="modal-body"><div class="field"><label>Tên chiến dịch *</label><input name="name" required maxlength="100" placeholder="Ví dụ: Chăm sóc khách tháng 11"></div><div class="field"><label>Loại chiến dịch</label><select name="type"><option>Tin nhắn</option><option>Tự động</option><option>Khuyến mãi</option></select></div><div class="field"><label>Kênh</label><select name="channel">${['Đa kênh',...channels].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="notice">${icon('info')}<span>Không gửi tin nhắn thật khi bật chiến dịch demo.</span></div></div>${formFoot('Tạo chiến dịch')}</form>`)}
function simpleModal(kind){if(kind==='faq')modal('Thêm câu hỏi thường gặp',`<form id="faq-form"><div class="modal-body"><div class="field"><label>Câu hỏi *</label><input name="q" required maxlength="150" placeholder="Khách thường hỏi gì?"></div><div class="field"><label>Câu trả lời *</label><textarea name="a" required maxlength="1000" placeholder="Soạn nội dung rõ ràng, chính xác..."></textarea></div></div>${formFoot('Lưu FAQ')}</form>`);if(kind==='comment')modal('Thêm bình luận thử',`<form id="comment-form"><div class="modal-body"><div class="field"><label>Tên người bình luận *</label><input name="name" required maxlength="70" placeholder="Khách hàng mẫu"></div><div class="field"><label>Nội dung *</label><textarea name="text" required maxlength="400" placeholder="Em chốt 1 sản phẩm nhé!"></textarea></div></div>${formFoot('Thêm bình luận')}</form>`);if(kind==='team')modal('Thêm nhân sự demo',`<form id="team-form"><div class="modal-body"><div class="field"><label>Tên nhân viên *</label><input name="name" required maxlength="70"></div><div class="field"><label>Vai trò</label><select name="role"><option>Nhân viên</option><option>Quản lý</option></select></div></div>${formFoot('Thêm nhân sự')}</form>`)}
function detailModal(id){let o=state.orders.find(o=>o.id===id);if(!o)return;modal('Chi tiết đơn '+o.id,`<div class="modal-body"><div class="between"><b style="color:#27446a">Đơn hàng ${o.id}</b>${pill(o.status)}</div><div class="separator"></div><div class="side-item"><span>Khách hàng</span><strong>${escapeHTML(customer(o.customerId).name)}</strong></div><div class="side-item"><span>Sản phẩm</span><strong>${escapeHTML(product(o.productId).name)} × ${o.qty}</strong></div><div class="side-item"><span>Kênh bán</span><strong>${escapeHTML(o.channel)}</strong></div><div class="side-item"><span>Ngày tạo</span><strong>${dateVN(o.date)}</strong></div><div class="separator"></div><div class="between"><b>Tổng cộng</b><h2>${money(o.qty*o.price)}</h2></div><div class="notice mt">${icon('info')}<span>Thông tin thanh toán và vận chuyển thực tế cần kết nối dịch vụ riêng.</span></div></div><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Đóng</button></div>`)}
function csv(name,rows){let blob=new Blob(['\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});downloadBlob(name,blob)}
function downloadBlob(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),250)}
function suggestion(){let c=state.conversations.find(c=>c.id===selectedConv);if(!c)return '';const t=(c.messages.filter(m=>m.from==='customer').at(-1)?.text||'').toLowerCase(),n=customer(c.customerId).name.split(' ').slice(-1)[0];let answer='Dạ em chào anh/chị '+n+' ạ! Shop đã nhận được yêu cầu và sẽ kiểm tra thông tin để tư vấn chính xác nhất ạ.';if(t.includes('giá')){let p=state.products.find(p=>t.includes(p.name.toLowerCase().split(' ')[0])||p.name.toLowerCase().split(' ').some(w=>w.length>=4&&t.includes(w)));answer=p?`Dạ sản phẩm ${p.name} hiện có giá ${money(p.price)}. Kho demo đang ghi nhận ${p.stock} sản phẩm. Em có thể hỗ trợ mình chọn mẫu phù hợp ạ!`:'Dạ anh/chị cho shop xin tên hoặc ảnh sản phẩm để em báo giá chính xác ạ.'}else if(t.includes('ship')||t.includes('vận chuyển'))answer=state.faq.find(f=>f.q.toLowerCase().includes('vận chuyển'))?.a||answer;else if(t.includes('mua')||t.includes('chốt')||t.includes('đặt'))answer='Dạ em cảm ơn anh/chị đã quan tâm! Anh/chị cho shop xin tên sản phẩm, số lượng và địa chỉ nhận hàng để nhân viên kiểm tra và xác nhận đơn nhé.';return state.config.tone==='Chuyên nghiệp'?answer.replaceAll('Dạ ','').replaceAll('ạ!','.'):(state.config.tone==='Ngắn gọn'?answer.slice(0,140):answer)}
function resetFilters(){query='';statusFilter='Tất cả';render()}
document.addEventListener('click',e=>{if(e.target.id==='modal-backdrop'){closeModal();return}let b=e.target.closest('[data-page],[data-action]');if(!b)return;const p=b.dataset.page,action=b.dataset.action,id=b.dataset.id;if(p){go(p);return}switch(action){case'toggle-sidebar':sidebarOpen=!sidebarOpen;render();break;case'close-sidebar':sidebarOpen=false;render();break;case'alerts':{const count=state.products.filter(p=>p.stock<10).length;toast(count?`${count} sản phẩm có tồn kho dưới 10. Xem mục Sản phẩm & kho.`:'Không có cảnh báo tồn kho.');break}case'close-modal':closeModal();break;case'reset-filters':resetFilters();break;case'add-product':productModal();break;case'edit-product':productModal(id);break;case'delete-product':{let p=state.products.find(p=>p.id===id);if(!p)return;if(state.orders.some(o=>o.productId===id)){toast('Không thể xóa sản phẩm đã có trong lịch sử đơn hàng.',true);break}if(confirm(`Xóa sản phẩm “${p.name}” khỏi dữ liệu mẫu?`)){state.products=state.products.filter(x=>x.id!==id);save();render();toast('Đã xóa sản phẩm.')}break}case'add-customer':customerModal();break;case'edit-customer':customerModal(id);break;case'add-order':orderModal();break;case'order-conv':{let c=state.conversations.find(c=>c.id===selectedConv);if(c)orderModal(c.customerId);break}case'order-detail':detailModal(id);break;case'select-conv':selectedConv=id;{let c=state.conversations.find(c=>c.id===id);if(c)c.unread=false;save();render()}break;case'resolve-conv':{let c=state.conversations.find(c=>c.id===id);if(c){c.resolved=!c.resolved;c.tag=c.resolved?'Đã xử lý':'Cần phản hồi';save();render();toast(c.resolved?'Đã đánh dấu hoàn tất.':'Đã mở lại hội thoại.')}break}case'tag-conv':{let c=state.conversations.find(c=>c.id===selectedConv);if(c){let n=prompt('Nhãn hội thoại mới:',c.tag);if(n!==null&&n.trim()){c.tag=n.trim().slice(0,35);save();render();toast('Đã cập nhật nhãn.')}}break}case'ai-draft':{if(!state.config.aiOn){toast('Bạn đang tắt gợi ý. Hãy bật tại mục Trợ lý AI.',true);break}let t=document.getElementById('chat-text');if(t){t.value=suggestion();t.focus();toast('Đã tạo gợi ý theo quy tắc demo. Hãy kiểm tra trước khi gửi.')}break}case'toggle-live':state.config.liveActive=!state.config.liveActive;save();render();toast(state.config.liveActive?'Đã bật phiên mô phỏng.':'Đã kết thúc phiên mô phỏng.');break;case'save-live-keyword':{const inp=document.getElementById('live-keyword');state.config.liveKeyword=(inp?.value||'').slice(0,150);save();render();toast('Đã lưu từ khóa nhận diện.');break}case'add-comment':simpleModal('comment');break;case'add-faq':simpleModal('faq');break;case'delete-faq':if(confirm('Xóa câu hỏi thường gặp này?')){state.faq=state.faq.filter(f=>f.id!==id);save();render();toast('Đã xóa FAQ.')}break;case'save-ai':state.config.tone=document.getElementById('ai-tone').value;state.config.aiOn=document.getElementById('ai-toggle').checked;save();render();toast('Đã lưu thiết lập gợi ý.');break;case'add-campaign':campaignModal();break;case'toggle-campaign':{let c=state.campaigns.find(x=>x.id===id);if(c){c.status=c.status==='Đang chạy'?'Tạm dừng':'Đang chạy';save();render();toast('Đã cập nhật trạng thái thử. Không gửi tin nhắn thật.')}break}case'add-team':simpleModal('team');break;case'delete-team':if(confirm('Xóa thành viên demo?')){state.team=state.team.filter(t=>t.id!==id);save();render();toast('Đã xóa thành viên demo.')}break;case'save-settings':state.config.shop=document.getElementById('shop-name').value.trim().slice(0,75)||'Cửa hàng Omniflow';state.config.notify=document.getElementById('notif-toggle').checked;save();render();toast('Đã lưu thông tin cửa hàng.');break;case'connect-info':modal('Kết nối '+(b.dataset.name||''),`<div class="modal-body"><div class="notice">${icon('shield')}<span>Chưa cấu hình tích hợp thực. Để kết nối, cần backend HTTPS, ứng dụng được nhà cung cấp phê duyệt quyền và quy trình OAuth/Webhook hợp lệ.</span></div><p class="small muted" style="margin:15px 0">Không nhập Access Token hoặc bí mật API vào website tĩnh hay kho GitHub công khai.</p></div><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Đã hiểu</button></div>`);break;case'reset-data':if(confirm('Khôi phục toàn bộ dữ liệu mẫu? Mọi thay đổi trong trình duyệt này sẽ bị mất.')){state=defaultState();save();query='';statusFilter='Tất cả';selectedConv='M01';render();toast('Đã khôi phục dữ liệu mẫu.')}break;case'backup-data':downloadBlob('OmniflowAI_Sao_Luu_Demo.json',new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}));toast('Đã tạo bản sao lưu dữ liệu thử.');break;case'export-orders':csv('OmniflowAI_Don_Hang.csv',[['Mã đơn','Khách hàng','Sản phẩm','Số lượng','Đơn giá','Tổng tiền','Trạng thái','Kênh','Ngày'],...state.orders.map(o=>[o.id,customer(o.customerId).name,product(o.productId).name,o.qty,o.price,o.qty*o.price,o.status,o.channel,dateVN(o.date)])]);toast('Đã xuất file CSV đơn hàng.');break;case'export-products':csv('OmniflowAI_San_Pham.csv',[['Mã SKU','Tên sản phẩm','Danh mục','Giá','Tồn kho'],...state.products.map(p=>[p.sku,p.name,p.category,p.price,p.stock])]);toast('Đã xuất file CSV sản phẩm.');break;case'export-customers':csv('OmniflowAI_Khach_Hang.csv',[['Tên','Số điện thoại','Email','Kênh'],...state.customers.map(c=>[c.name,c.phone,c.email,c.channel])]);toast('Đã xuất file CSV khách hàng.');break;default:break}});
document.addEventListener('input',e=>{if(e.target.id==='list-search'){query=e.target.value;render()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='list-filter'){statusFilter=el.value;render()}else if(el.hasAttribute('data-window')){windowDays=Number(el.value)||30;render()}else if(el.hasAttribute('data-order-status')){const o=state.orders.find(x=>x.id===el.dataset.orderStatus);if(!o)return;const before=o.status,after=el.value;if(before===after)return;const p=state.products.find(x=>x.id===o.productId);if(o.inventoryReserved){if(before==='Đã hủy'&&after!=='Đã hủy'){if(!p||p.stock<o.qty){toast('Không đủ hàng tồn kho để khôi phục đơn.',true);render();return}p.stock-=o.qty}if(before!=='Đã hủy'&&after==='Đã hủy'&&p)p.stock+=o.qty}o.status=after;save();render();toast('Đã cập nhật trạng thái '+o.id+'.')}else if(el.id==='jump-search'){let v=el.value.toLowerCase().trim();const match=Object.keys(titles).find(k=>titles[k].toLowerCase().includes(v));if(match)go(match);else toast('Không tìm thấy màn hình phù hợp.',true)}});
document.addEventListener('submit',e=>{let f=e.target;const formId=f.getAttribute('id');if(!formId||!['product-form','customer-form','order-form','campaign-form','faq-form','comment-form','team-form','chat-form'].includes(formId))return;e.preventDefault();if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));switch(formId){case'product-form':{let name=d.name.trim(),sku=d.sku.trim().toUpperCase(),price=Number(d.price),stock=Number(d.stock);if(!name||!sku||!Number.isInteger(stock)||stock<0||price<0){toast('Vui lòng kiểm tra thông tin sản phẩm.',true);return}if(state.products.some(p=>p.sku.toUpperCase()===sku&&p.id!==d.id)){toast('Mã SKU đã tồn tại.',true);return}let existing=state.products.find(p=>p.id===d.id),item={id:existing?.id||'P'+Date.now(),name,sku,price,stock,category:d.category.trim()||'Khác',emoji:d.emoji.trim()||'📦'};if(existing)Object.assign(existing,item);else state.products.unshift(item);break}case'customer-form':{let name=d.name.trim(),phone=d.phone.trim();if(!name||phone.length<5){toast('Thông tin khách hàng không hợp lệ.',true);return}let existing=state.customers.find(c=>c.id===d.id),item={id:existing?.id||'C'+Date.now(),name,phone,email:d.email.trim(),channel:d.channel};if(existing)Object.assign(existing,item);else state.customers.unshift(item);break}case'order-form':{let p=state.products.find(p=>p.id===d.productId),c=state.customers.find(c=>c.id===d.customerId),qty=Number(d.qty);if(!p||!c||!Number.isInteger(qty)||qty<=0){toast('Vui lòng chọn khách, sản phẩm và số lượng hợp lệ.',true);return}if(qty>p.stock){toast(`Tồn kho chỉ còn ${p.stock} sản phẩm.`,true);return}let next=Math.max(1000,...state.orders.map(o=>Number(o.id.replace(/\D/g,''))||0))+1;p.stock-=qty;state.orders.unshift({id:'DH'+next,customerId:c.id,productId:p.id,qty,price:p.price,status:'Mới',channel:d.channel,date:dateOffset(0),inventoryReserved:true});break}case'campaign-form':state.campaigns.unshift({id:'MK'+Date.now(),name:d.name.trim(),type:d.type,status:'Bản nháp',channel:d.channel,date:dateOffset(0)});break;case'faq-form':state.faq.unshift({id:'F'+Date.now(),q:d.q.trim(),a:d.a.trim()});break;case'comment-form':{let now=new Date();state.liveComments.push({id:'L'+Date.now(),name:d.name.trim(),text:d.text.trim(),time:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`});break}case'team-form':state.team.push({id:'T'+Date.now(),name:d.name.trim(),role:d.role});break;case'chat-form':{let c=state.conversations.find(c=>c.id===selectedConv),msg=d.message.trim();if(!c||!msg)return;let now=new Date();c.messages.push({from:'me',text:msg.slice(0,1500),time:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`});save();render();toast('Đã lưu phản hồi trong bản demo; không gửi tới nền tảng thật.');return}}save();closeModal();render();toast('Đã lưu dữ liệu thành công.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(sidebarOpen){sidebarOpen=false;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.conv-item[role="button"]')){e.preventDefault();e.target.click()}});
window.addEventListener('hashchange',()=>{let p=decodeURIComponent(location.hash.slice(1))||'dashboard';if(p!==page&&views[p]){page=p;query='';statusFilter='Tất cả';sidebarOpen=false;render()}});
render();
</script>
</body></html>
